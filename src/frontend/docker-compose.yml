version: '3.8'

services:
  # Frontend development service
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: viewzenix-frontend
    volumes:
      - ./:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - REACT_APP_API_URL=http://localhost:5000/api/v1
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    healthcheck:
      test: ["CMD", "node", "healthcheck.js"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - viewzenix-network

  # Frontend production build (for testing production build locally)
  frontend-prod:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: viewzenix-frontend-prod
    ports:
      - "8080:80"
    networks:
      - viewzenix-network
    profiles:
      - prod

networks:
  viewzenix-network:
    driver: bridge 